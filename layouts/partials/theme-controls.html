<div class="theme-controls" aria-label="Theme controls">
  <button class="mode-toggle" type="button" data-theme-toggle aria-label="Toggle light or dark mode">
    <span class="mode-toggle__icon" data-mode-icon aria-hidden="true"></span>
    <span class="mode-toggle__label" data-mode-label>Light</span>
  </button>
  <select class="palette-select" data-palette-select aria-label="Color palette">
    <option value="ivory">Ivory</option>
    <option value="sage">Sage</option>
    <option value="mist">Mist Blue</option>
    <option value="lavender">Lavender</option>
    <option value="sand">Sand</option>
    <option value="rose">Rose</option>
  </select>
</div>
