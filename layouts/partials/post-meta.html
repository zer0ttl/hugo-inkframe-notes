<div class="post-meta">
  {{ if not .Date.IsZero }}<time datetime="{{ .Date.Format "2006-01-02" }}">{{ upper (.Date.Format "Jan 2, 2006") }}</time>{{ end }}
  {{ with .Params.categories }}<span>{{ delimit . ", " | upper }}</span>{{ end }}
  {{ if .ReadingTime }}<span>{{ .ReadingTime }} MIN READ</span>{{ end }}
</div>
